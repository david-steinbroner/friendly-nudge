# SwiftLint configuration for Friendly Nudge
# Reasonable rules, minimal noise

# Paths to include
included:
  - FriendlyNudge

# Paths to exclude
excluded:
  - Pods
  - DerivedData
  - build
  - .build
  - "**/*.generated.swift"

# Disabled rules (too noisy or stylistic)
disabled_rules:
  - trailing_comma
  - identifier_name
  - type_name
  - nesting
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - opening_brace
  - statement_position
  - todo

# Opt-in rules
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_object_literal
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - lower_acl_than_parent
  - modifier_order
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule configuration
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 3
  error: 4

# Reporter
reporter: "xcode"
