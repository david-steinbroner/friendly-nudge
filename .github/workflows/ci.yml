name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: Run SwiftFormat (check)
        run: swiftformat --lint FriendlyNudge --config .swiftformat

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict

      - name: Print Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project FriendlyNudge/FriendlyNudge.xcodeproj

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FriendlyNudge/FriendlyNudge.xcodeproj \
            -scheme FriendlyNudge \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project FriendlyNudge/FriendlyNudge.xcodeproj \
            -scheme FriendlyNudge \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
